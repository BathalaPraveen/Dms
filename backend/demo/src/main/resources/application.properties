# run on port 5000 so React URL matches
server.port=5000

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/mern_stack_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=YOUR_DB_PASSWORD

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# JWT
jwt.secret=ReplaceWithAStrongSecretKeyChangeMe
jwt.expiration=3600000
